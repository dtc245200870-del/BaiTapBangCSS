<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS cho bảng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #ffffff;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            height: 50px;
            text-align: left;
            vertical-align: middle;
            padding: 15px;
            background-color: #333333;
            color: white;
        }

        td {
            height: 50px;
            padding: 15px;
            vertical-align: bottom;
            background-color: #f2f2f2;
            color: #333333;
        }

        tr:hover td {
            background-color: #d9eaf7;
        }
    </style>
</head>

<body>
    <h1>BẢNG THÔNG TIN SINH VIÊN</h1>

    <table>
        <tr>
            <th>Họ tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>

        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>Web</td>
        </tr>

        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>Web</td>
        </tr>

        <tr>
            <td>Lê Văn C</td>
            <td>19</td>
            <td>HTML CSS</td>
        </tr>
    </table>
</body>
</html>
